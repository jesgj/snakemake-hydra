pipeline: "wgbs"  # Change to "rnaseq", "wgbs", "chip_cr", or "atacseq".

rnaseq:
  raw_fastqs_dir: "data/rnaseq_raw_fastqs"
  samples_info:
    sample_a:
      R1: "data/rnaseq_raw_fastqs/sample_a_R1.fastq.gz"
      R2: "data/rnaseq_raw_fastqs/sample_a_R2.fastq.gz"
      type: "PE"
    sample_b:
      R1: "data/rnaseq_raw_fastqs/sample_b_R1.fastq.gz"
      R2: "data/rnaseq_raw_fastqs/sample_b_R2.fastq.gz"
      type: "PE"
  qc_dir: "results/rnaseq/qc_raw"
  trimmed_dir: "results/rnaseq/trimmed_fastqs"
  qc_trimmed_dir: "results/rnaseq/qc_trimmed"
  # Reference files are user-managed and must already exist.
  # The parent directory of kallisto_index must already exist; hisat2_index_dir is created if needed.
  transcriptome_fasta: "ref/transcriptome.fa"
  kallisto_index: "ref/kallisto/transcriptome.idx"
  kallisto_output_dir: "results/rnaseq/kallisto"
  kallisto:
    extra_args: "--bootstrap-samples=100"
  ref_genome: "ref/genome.fa"
  hisat2_index_dir: "ref/hisat2"
  alignment_dir: "results/rnaseq/aligned_bams"  # Sorted BAMs and HISAT2 summary files are written here.
  marked_bam_dir: "results/rnaseq/marked_bams"
  duplication_qc_dir: "results/rnaseq/duplication_qc"
  bigwig_dir: "results/rnaseq/bigwigs"
  deeptools_dir: "results/rnaseq/deeptools"
  gene_body_coverage_dir: "results/rnaseq/gene_body_coverage"
  multiqc_results_dir: "results/rnaseq"
  hisat2:
    extra_args: ""
  fastp:
    extra_args: "-q 20 --trim_front1 13 --detect_adapter_for_pe --dont_eval_duplication --trim_poly_g --trim_poly_x"
  picard:
    java_opts: "-Xmx4g"
    markduplicates:
      extra_args: ""
  deeptools:
    multiBamSummary:
      extra_args: "--binSize 10000"
    plotCorrelation:
      extra_args: "-p heatmap --corMethod spearman --skipZeros"
    bamCoverage:
      normalize_using: "RPKM"
      extra_args: "--binSize 10"
  gene_body_coverage:
    enabled: false
    refgene_bed: "ref/genes.bed12"
    minimum_length: 100
    format: "pdf"

wgbs:
  raw_fastqs_dir: "data/wgbs_raw_fastqs"
  samples_info:
    sample_a:
      R1: "data/wgbs_raw_fastqs/sample_a_R1.fastq.gz"
      R2: "data/wgbs_raw_fastqs/sample_a_R2.fastq.gz"
    sample_b:
      R1: "data/wgbs_raw_fastqs/sample_b_R1.fastq.gz"
      R2: "data/wgbs_raw_fastqs/sample_b_R2.fastq.gz"
  qc_dir: "results/wgbs/qc"
  trimmed_dir: "results/wgbs/trimmed_fastqs"
  qc_trimmed_dir: "results/wgbs/qc_trimmed"
  # ref_genome must already exist; Bismark creates Bisulfite_Genome next to it.
  ref_genome: "ref/genome.fa"
  alignment_dir: "results/wgbs/raw_bams"
  dedup_dir: "results/wgbs/dedup_bams"
  dedup_bam_qc_dir: "results/wgbs/dedup_bam_qc"
  filtered_bam_dir: "results/wgbs/filtered_bams"
  sorted_filtered_bam_dir: "results/wgbs/sorted_filtered_bams"
  filtered_bam_qc_dir: "results/wgbs/filtered_bam_qc"
  mbias_dir: "results/wgbs/mbias"
  methyldackel_dir: "results/wgbs/methyldackel"
  methyldackel_mergecontext_dir: "results/wgbs/methyldackel_mergecontext"
  multiqc_results_dir: "results/wgbs"
  log_dir: "logs/wgbs"
  fastp:
    extra_args: "-q 20 --trim_front1 10 --detect_adapter_for_pe --dont_eval_duplication --trim_poly_g --trim_poly_x --cut_tail"
  bismark:
    threads: 8
    parallel: 2
    extra_args: "--local -X 2000"
  sambamba:
    filter_threads: 2
    sort_threads: 2
    # Use Sambamba field names such as ref_name, mapping_quality, and proper_pair.
    extra_args: "mapping_quality >= 20 and proper_pair and not (unmapped or mate_is_unmapped or secondary_alignment or duplicate) and not (ref_name =~ /^(MT|chrM)/)"
  methyldackel_mbias:
    threads: 2
    extra_args: ""
  methyldackel_extract:
    threads: 1
    extra_args: ""
    extra_opts: "--minOppositeDepth 10 --maxVariantFrac 0.5"
  picard:
    java_opts: "-Xmx4g"

chip_cr:
  raw_fastqs_dir: "data/chip_test_pipeline"
  # Name matched controls as <base>_input_repN to enable automatic subtraction.
  # The <base> portion may contain additional underscores.
  samples_info:
    treatment_rep1:
      R1: "data/chip_test_pipeline/treatment_rep1_R1.fastq.gz"
      R2: "data/chip_test_pipeline/treatment_rep1_R2.fastq.gz"
      type: "PE"
    treatment_input_rep1:
      R1: "data/chip_test_pipeline/treatment_input_rep1_R1.fastq.gz"
      R2: "data/chip_test_pipeline/treatment_input_rep1_R2.fastq.gz"
      type: "PE"
  # Reference FASTA and BED inputs must already exist; bowtie2_index_dir is created if needed.
  gene_bed: "ref/genes.bed"
  qc_dir: "results/chipseq_cutrun/qc_raw"
  ref_genome: "ref/genome.fa"
  trimmed_dir: "results/chipseq_cutrun/trimmed_fastqs"
  qc_trimmed_dir: "results/chipseq_cutrun/qc_trimmed"
  alignment_dir: "results/chipseq_cutrun/aligned_bams"
  bowtie2_index_dir: "ref/bowtie2/chip_cr"
  bam_qc_dir: "results/chipseq_cutrun/bam_qc"
  filtered_bam_dir: "results/chipseq_cutrun/filtered_bams"
  filtered_bam_qc_dir: "results/chipseq_cutrun/filtered_bam_qc"
  deeptools_dir: "results/chipseq_cutrun/deeptools"
  bigwig_dir: "results/chipseq_cutrun/bigwigs"
  subtracted_bigwig_dir: "results/chipseq_cutrun/subtracted_bigwigs"
  multiqc_results_dir: "results/chipseq_cutrun"
  fastp:
    extra_args: "-q 20 -l 50"
  bowtie2:
    extra_args: ""
  sambamba:
    markdup_extra_args: "-r"
    view_extra_args: "not unmapped"
  deeptools:
    multiBamSummary:
      extra_args: "--binSize 10000"
    computeMatrix:
      extra_args: ""
      beforeRegionStartLength: 3000
      regionBodyLength: 5000
      afterRegionStartLength: 3000
      skipZeros: true
    plotCorrelation:
      extra_args: "-p heatmap --corMethod spearman --skipZeros"
    plotFingerprint:
      extra_args: ""
    bamCoverage:
      normalize_using: "CPM"
      extra_args: ""
    bigwigCompare:
      method: "subtract"
      extra_args: ""
  picard:
    java_opts: "-Xmx4g"

atacseq:
  raw_fastqs_dir: "data/atacseq_raw_fastqs"
  samples_info:
    sample_a:
      R1: "data/atacseq_raw_fastqs/sample_a_R1.fastq.gz"
      R2: "data/atacseq_raw_fastqs/sample_a_R2.fastq.gz"
      type: "PE"
  qc_dir: "results/atacseq/qc_raw"
  trimmed_dir: "results/atacseq/trimmed_fastqs"
  qc_trimmed_dir: "results/atacseq/qc_trimmed"
  # ref_genome must already exist. Set bowtie2_index_prefix to reuse a complete
  # prebuilt index; otherwise Hydra builds one inside bowtie2_index_dir.
  ref_genome: "ref/genome.fa"
  bowtie2_index_prefix: null  # Prefix passed to bowtie2 -x, without a .bt2/.bt2l suffix.
  bowtie2_index_dir: "ref/bowtie2/atacseq"
  reference_dir: "results/atacseq/reference"
  alignment_dir: "results/atacseq/aligned_bams"
  marked_bam_dir: "results/atacseq/marked_bams"  # Temporary Sambamba markdup BAMs are written here.
  duplication_qc_dir: "results/atacseq/duplication_qc"
  bam_qc_dir: "results/atacseq/bam_qc"
  filtered_bam_dir: "results/atacseq/filtered_bams"
  filtered_bam_qc_dir: "results/atacseq/filtered_bam_qc"
  deeptools_dir: "results/atacseq/deeptools"
  fragment_qc_dir: "results/atacseq/fragment_qc"
  bigwig_dir: "results/atacseq/bigwigs"
  peaks_dir: "results/atacseq/peaks"
  consensus_peaks_dir: "results/atacseq/consensus_peaks"
  featurecounts_dir: "results/atacseq/featurecounts"
  qc_summary_dir: "results/atacseq/qc_summary"
  multiqc_results_dir: "results/atacseq"
  peak_caller: "macs3"  # Set to "genrich" to use Genrich instead of MACS3.
  fastp:
    extra_args: "-q 20 -l 30"
  bowtie2:
    large_index: false  # Generated mode only; true creates and tracks .bt2l files.
    extra_args: "--very-sensitive -X 2000"
  sambamba:
    markdup_threads: 4
    markdup_extra_args: ""  # Do not use -r; duplicate removal happens during filtering.
    # Use Sambamba field names such as ref_name, mapping_quality, and proper_pair.
    view_extra_args: "not unmapped and proper_pair and mapping_quality >= 10 and not (ref_name =~ /^(MT|chrM)/)"
    filter_threads: 2
    sort_threads: 2
  deeptools:
    multiBamSummary:
      extra_args: "--binSize 10000"
    plotCorrelation:
      extra_args: "-p heatmap --corMethod spearman --skipZeros"
    plotFingerprint:
      extra_args: ""
    bamCoverage:
      normalize_using: "CPM"
      extra_args: ""
  macs3:
    genome_size: "1.4e9"  # Set this to the effective genome size for the configured reference.
    qvalue: 0.05
    extra_args: ""
  genrich:
    qvalue: 0.05
    min_auc: 20.0
    min_length: 0
    max_gap: 100
    extra_args: ""
  consensus_peaks:
    minimum_support: 1  # Number of samples that must overlap a consensus region.
  featurecounts:
    threads: 4
    minimum_mapping_quality: 0  # Filtering is controlled upstream by sambamba by default.
    extra_args: ""
  mitochondrial_contigs:
    - "MT"
    - "chrM"
  picard:
    java_opts: "-Xmx2g"
