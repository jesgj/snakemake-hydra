  methyldackel_mergecontext_dir: "results/wgbs/methyldackel_mergecontext"
  multiqc_results_dir: "results/wgbs"
  fastp:
    extra_args: "-q 20 --trim_front1 10 --detect_adapter_for_pe --dont_eval_duplication --trim_poly_g --trim_poly_x --cut_tail"
  bismark:
    threads: 66
    parallel: 8
    extra_args: "--local -X 2000"
  sambamba:
    filter_threads: 8
    sort_threads: 8
    extra_args: "mapping_quality >= 10 and proper_pair and not (unmapped or mate_is_unmapped or secondary_alignment or duplicate) and not (/home/jlgaralc/Masahito/Foxo6A/RNAseq_name =~ /^(MT|chrM)/)"
  methyldackel_mbias:
    threads: 16
    extra_args: ""
  methyldackel_extract:
    threads: 1
    extra_args: ""
    extra_opts: "--minOppositeDepth 10 --maxVariantFrac 0.5"
  picard:
    java_opts: "-Xmx4g" # AÑADIR --IS_BISULFITE_SEQUENCED

chip_cr:
  raw_fastqs_dir: "data/chip_test_pipeline/"
  # Name matched controls as <base>_input_repN to enable automatic subtraction.
  # The <base> portion may contain additional underscores.
  samples_info:
    Dome_ctrl_H3K4me3_rep1:
      R1: "data/chip_test_pipeline/Dome_ctrl_H3K4me3_rep1_R1.sample.fastq.gz"
      R2: "data/chip_test_pipeline/Dome_ctrl_H3K4me3_rep1_R2.sample.fastq.gz"
      type: "PE"
    Shield_ctrl_H3K27ac_rep1:
      R1: "data/chip_test_pipeline/Shield_ctrl_H3K27ac_rep1_R1.sample.fastq.gz"
      R2: "data/chip_test_pipeline/Shield_ctrl_H3K27ac_rep1_R2.sample.fastq.gz"
      type: "PE"
  # Reference FASTA and BED inputs must already exist; bowtie2_index_dir is created if needed.
  gene_bed: "/home/jlgaralc/Masahito/Foxo6A/RNAseq/genes.bed"
  qc_dir: "results/chipseq_cutrun/qc_raw"
  ref_genome: "/home/jlgaralc/Masahito/Foxo6A/RNAseq/Danio_rerio.GRCz11.dna.primary_assembly.fa.gz"
  trimmed_dir: "results/chipseq_cutrun/trimmed_fastqs"
  qc_trimmed_dir: "results/chipseq_cutrun/qc_trimmed"
  alignment_dir: "results/chipseq_cutrun/aligned_bams"
  bowtie2_index_dir: "/home/jlgaralc/Masahito/Foxo6A/RNAseq/bowtie2"
  bam_qc_dir: "results/chipseq_cutrun/bam_qc"
  filtered_bam_dir: "results/chipseq_cutrun/filtered_bams"
  filtered_bam_qc_dir: "results/chipseq_cutrun/filtered_bam_qc"
  deeptools_dir: "results/chipseq_cutrun/deeptools"
  bigwig_dir: "results/chipseq_cutrun/bigwigs"
  subtracted_bigwig_dir: "results/chipseq_cutrun/subtracted_bigwigs"
  multiqc_results_dir: "results/chipseq_cutrun"
  fastp:
    extra_args: "-q 20 -l 50"
  bowtie2:
    extra_args: ""
  sambamba:
    markdup_extra_args: "-r"
    view_extra_args: "not unmapped"
  deeptools:
    multiBamSummary:
      extra_args: "--binSize 10000"
    computeMatrix:
      extra_args: ""
      beforeRegionStartLength: 3000
      regionBodyLength: 5000
      afterRegionStartLength: 3000
      skipZeros: True
    plotCorrelation:
      extra_args: "-p heatmap --corMethod spearman --skipZeros"
    plotFingerprint:
      extra_args: ""
    bamCoverage:
      normalize_using: "CPM"
      extra_args: ""
    bigwigCompare:
      method: "subtract"
      extra_args: ""
  picard:
    java_opts: "-Xmx4g"

