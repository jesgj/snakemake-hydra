    extra_args: ""
  fastp:
    extra_args: "-q 20 --trim_front1 13 --detect_adapter_for_pe --dont_eval_duplication --trim_poly_g --trim_poly_x"
  picard:
    java_opts: "-Xmx4g"
    markduplicates:
      extra_args: ""
  deeptools:
    multiBamSummary:
      extra_args: "--binSize 10000"
    plotCorrelation:
      extra_args: "-p heatmap --corMethod spearman --skipZeros"
    bamCoverage:
      normalize_using: "RPKM"
      extra_args: "--binSize 10"
  gene_body_coverage:
    enabled: false  # Set to false to skip the RNA-seq gene body coverage QC step
    refgene_bed: "/home/jlgaralc/Masahito/Foxo6A/RNAseq/duumy.bed"  # Placeholder BED12 for dry-runs only; replace with a real annotation for production
    minimum_length: 100
    format: "pdf"

