  multiqc_results_dir: "results/atacseq"
  peak_caller: "macs3"  # Set to "genrich" to use Genrich instead of MACS3
  fastp:
    extra_args: "-q 20 -l 30"
  bowtie2:
    extra_args: "--very-sensitive -X 2000"
  sambamba:
    view_extra_args: "not unmapped and proper_pair and mapping_quality >= 10 and not (/home/jlgaralc/Masahito/Foxo6A/RNAseq_name =~ /^(MT|chrM)/)"
    filter_threads: 2
    sort_threads: 2
  deeptools:
    multiBamSummary:
      extra_args: "--binSize 10000"
    plotCorrelation:
      extra_args: "-p heatmap --corMethod spearman --skipZeros"
    plotFingerprint:
      extra_args: ""
    bamCoverage:
      normalize_using: "CPM"
      extra_args: ""
  macs3:
    genome_size: "1.4e9"
    qvalue: 0.05
    extra_args: ""
  genrich:
    qvalue: 0.05
    min_auc: 20.0
    min_length: 0
    max_gap: 100
    extra_args: ""
  picard:
    java_opts: "-Xmx2g"
    markduplicates:
      extra_args: ""
