<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1610" viewBox="0 0 1200 1610" role="img" aria-labelledby="title desc">
  <title id="title">Hydra: four NGS workflows, one reproducible environment</title>
  <desc id="desc">A configuration selects one Snakemake workflow. FASTQ quality control and trimming feed RNA-seq expression analysis, WGBS methylation analysis, ChIP-seq or CUT&amp;RUN enrichment analysis, or ATAC-seq accessibility analysis. ATAC validates original pairs, aligns each run with read groups, and merges runs before sample-level duplicate marking. Each selected workflow produces analysis files and a MultiQC report. This is an overview, not an exact dependency DAG.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 40px; font-weight: 750; fill: #122238; }
      .subtitle { font-size: 20px; fill: #526176; }
      .label { font-size: 14px; font-weight: 700; letter-spacing: 1.6px; fill: #526176; }
      .heading { font-size: 25px; font-weight: 750; fill: #122238; }
      .step { font-size: 20px; font-weight: 650; fill: #122238; }
      .copy { font-size: 17px; fill: #526176; }
      .small { font-size: 15px; fill: #526176; }
      .tag { font-size: 15px; font-weight: 650; font-family: ui-monospace, "DejaVu Sans Mono", monospace; }
      .number { font-size: 15px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .choice { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5 6; }
    </style>
  </defs>
  <rect width="1200" height="1610" rx="24" fill="#f5f7fb"/>
  <!-- Configuration selects a workflow; dashed lines denote alternatives. -->
  <text class="label" x="48" y="44">SNAKEMAKE + PIXI</text>
  <text class="title" x="48" y="94">One pipeline. Four analysis paths.</text>
  <text class="subtitle" x="48" y="129">Reproducible NGS processing, from original reads to analysis-ready results.</text>
  <rect x="48" y="162" width="1104" height="98" rx="16" fill="#122238"/>
  <text x="72" y="194" fill="#a9bfdc" font-size="14" font-weight="700" letter-spacing="1.4">01 / CONFIGURE</text>
  <text x="72" y="226" fill="#fff" font-size="21" font-weight="650">Samples + references + tool settings</text>
  <path d="M521 210h64" stroke="#a9bfdc" stroke-width="2"/>
  <text x="612" y="194" fill="#a9bfdc" font-size="14" font-weight="700" letter-spacing="1.4">SELECT ONE WORKFLOW</text>
  <text x="612" y="226" fill="#fff" font-size="20" font-family="ui-monospace, monospace">config["pipeline"] → Snakefile</text>
  <path class="flow" d="M600 260v28"/>
  <rect x="48" y="290" width="1104" height="130" rx="16" fill="#fff" stroke="#d5ddea"/>
  <text class="label" x="72" y="320">02 / READ PREPARATION</text>
  <text class="step" x="72" y="354">Resolve samples</text>
  <text class="small" x="72" y="383">Manifest or discovery</text>
  <path class="flow" d="M265 352h42"/>
  <text class="step" x="328" y="354">Raw read QC</text>
  <text class="small" x="328" y="383">FastQC</text>
  <path class="flow" d="M503 352h42"/>
  <text class="step" x="566" y="354">Trim adapters</text>
  <text class="small" x="566" y="383">fastp · quality filtering</text>
  <path class="flow" d="M785 352h42"/>
  <text class="step" x="848" y="354">Trimmed read QC</text>
  <text class="small" x="848" y="383">FastQC</text>
  <text class="label" x="48" y="461">03 / ANALYZE</text>
  <text class="small" x="1152" y="461" text-anchor="end">Alternatives, not four simultaneous workflows</text>
  <path class="choice" d="M600 420v61M324 493v-12h552v12M48 481H30v498h18M1152 481h18v498h-18"/>
  <g aria-label="RNA-seq">
  <rect x="48" y="493" width="536" height="454" rx="18" fill="#fff" stroke="#d5ddea"/>
  <path d="M66 493h500" stroke="#087f68" stroke-width="4" stroke-linecap="round"/>
  <text class="heading" x="72" y="535" >RNA-seq</text>
  <rect x="450" y="512" width="110" height="30" rx="8" fill="#e8f6f0"/>
  <text class="tag" x="505.0" y="533" fill="#087f68" text-anchor="middle">rnaseq</text>
  <text class="copy" x="72" y="563" >Paired-end · gene expression</text>
  <path d="M72 583h488" stroke="#e3e8f0"/>
  <circle cx="86" cy="611" r="14" fill="#e8f6f0"/>
  <text class="number" x="86" y="611" fill="#087f68">1</text>
  <text class="step" x="112" y="617" >Quantify transcripts ∥ align reads</text>
  <text class="small" x="112" y="641" >Kallisto abundance · HISAT2 genomic alignment</text>
  <path d="M86 629v27" stroke="#087f68" stroke-opacity=".3" stroke-width="2"/>
  <circle cx="86" cy="675" r="14" fill="#e8f6f0"/>
  <text class="number" x="86" y="675" fill="#087f68">2</text>
  <text class="step" x="112" y="681" >Mark duplicates; retain reads</text>
  <text class="small" x="112" y="705" >Picard metrics · sorted BAM + index</text>
  <path d="M86 693v27" stroke="#087f68" stroke-opacity=".3" stroke-width="2"/>
  <circle cx="86" cy="739" r="14" fill="#e8f6f0"/>
  <text class="number" x="86" y="739" fill="#087f68">3</text>
  <text class="step" x="112" y="745" >Generate normalized coverage</text>
  <text class="small" x="112" y="769" >deepTools bamCoverage → bigWig</text>
  <path d="M86 757v27" stroke="#087f68" stroke-opacity=".3" stroke-width="2"/>
  <circle cx="86" cy="803" r="14" fill="#e8f6f0"/>
  <text class="number" x="86" y="803" fill="#087f68">4</text>
  <text class="step" x="112" y="809" >Assess cohort and gene-body QC</text>
  <text class="small" x="112" y="833" >Correlation ≥2 BAMs · optional RSeQC</text>
  <rect x="64" y="845" width="504" height="90" rx="12" fill="#e8f6f0"/>
  <text class="label" x="80" y="864" style="fill:#087f68; font-size:12px">DELIVERABLES</text>
  <text class="copy" x="80" y="888">abundance.tsv · BAM / BAI · duplicate metrics</text>
  <text class="copy" x="80" y="910">bigWig · correlation / gene-body plots</text>
  <text class="small" x="80" y="928" style="font-size:13px">Gene-body heatmap: enabled and ≥3 samples.</text>
  </g>
  <g aria-label="WGBS">
  <rect x="616" y="493" width="536" height="454" rx="18" fill="#fff" stroke="#d5ddea"/>
  <path d="M634 493h500" stroke="#7051c4" stroke-width="4" stroke-linecap="round"/>
  <text class="heading" x="640" y="535" >WGBS</text>
  <rect x="1018" y="512" width="110" height="30" rx="8" fill="#f1edfa"/>
  <text class="tag" x="1073.0" y="533" fill="#7051c4" text-anchor="middle">wgbs</text>
  <text class="copy" x="640" y="563" >Paired-end · CpG methylation</text>
  <path d="M640 583h488" stroke="#e3e8f0"/>
  <circle cx="654" cy="611" r="14" fill="#f1edfa"/>
  <text class="number" x="654" y="611" fill="#7051c4">1</text>
  <text class="step" x="680" y="617" >Prepare genome; align reads</text>
  <text class="small" x="680" y="641" >Bismark bisulfite index + alignment</text>
  <path d="M654 629v27" stroke="#7051c4" stroke-opacity=".3" stroke-width="2"/>
  <circle cx="654" cy="675" r="14" fill="#f1edfa"/>
  <text class="number" x="654" y="675" fill="#7051c4">2</text>
  <text class="step" x="680" y="681" >Deduplicate and filter</text>
  <text class="small" x="680" y="705" >deduplicate_bismark · Sambamba</text>
  <path d="M654 693v27" stroke="#7051c4" stroke-opacity=".3" stroke-width="2"/>
  <circle cx="654" cy="739" r="14" fill="#f1edfa"/>
  <text class="number" x="654" y="739" fill="#7051c4">3</text>
  <text class="step" x="680" y="745" >Sort, index, and assess BAMs</text>
  <text class="small" x="680" y="769" >Samtools · Picard alignment metrics</text>
  <path d="M654 757v27" stroke="#7051c4" stroke-opacity=".3" stroke-width="2"/>
  <circle cx="654" cy="803" r="14" fill="#f1edfa"/>
  <text class="number" x="654" y="803" fill="#7051c4">4</text>
  <text class="step" x="680" y="809" >Measure bias; extract methylation</text>
  <text class="small" x="680" y="833" >MethylDackel mbias → extract → mergeContext</text>
  <rect x="632" y="845" width="504" height="90" rx="12" fill="#f1edfa"/>
  <text class="label" x="648" y="864" style="fill:#7051c4; font-size:12px">DELIVERABLES</text>
  <text class="copy" x="648" y="888">Filtered BAM / BAI · M-bias TSV</text>
  <text class="copy" x="648" y="910">CpG.methylKit · CpG.bedGraph</text>
  <text class="small" x="648" y="928" style="font-size:13px">M-bias-derived options guide methylation extraction.</text>
  </g>
  <g aria-label="ChIP / CUT&amp;RUN">
  <rect x="48" y="979" width="536" height="454" rx="18" fill="#fff" stroke="#d5ddea"/>
  <path d="M66 979h500" stroke="#b25d17" stroke-width="4" stroke-linecap="round"/>
  <text class="heading" x="72" y="1021" >ChIP / CUT&amp;RUN</text>
  <rect x="444" y="998" width="116" height="30" rx="8" fill="#fff3e7"/>
  <text class="tag" x="502.0" y="1019" fill="#b25d17" text-anchor="middle">chip_cr</text>
  <text class="copy" x="72" y="1049" >Paired- or single-end · protein–DNA enrichment</text>
  <path d="M72 1069h488" stroke="#e3e8f0"/>
  <circle cx="86" cy="1097" r="14" fill="#fff3e7"/>
  <text class="number" x="86" y="1097" fill="#b25d17">1</text>
  <text class="step" x="112" y="1103" >Align reads to the genome</text>
  <text class="small" x="112" y="1127" >Bowtie2 → sorted BAM</text>
  <path d="M86 1115v27" stroke="#b25d17" stroke-opacity=".3" stroke-width="2"/>
  <circle cx="86" cy="1161" r="14" fill="#fff3e7"/>
  <text class="number" x="86" y="1161" fill="#b25d17">2</text>
  <text class="step" x="112" y="1167" >Remove duplicates; filter and QC</text>
  <text class="small" x="112" y="1191" >Sambamba · Samtools · Picard · deepTools</text>
  <path d="M86 1179v27" stroke="#b25d17" stroke-opacity=".3" stroke-width="2"/>
  <circle cx="86" cy="1225" r="14" fill="#fff3e7"/>
  <text class="number" x="86" y="1225" fill="#b25d17">3</text>
  <text class="step" x="112" y="1231" >Create coverage and contrast tracks</text>
  <text class="small" x="112" y="1255" >bamCoverage · matched-input bigWigCompare</text>
  <path d="M86 1243v27" stroke="#b25d17" stroke-opacity=".3" stroke-width="2"/>
  <circle cx="86" cy="1289" r="14" fill="#fff3e7"/>
  <text class="number" x="86" y="1289" fill="#b25d17">4</text>
  <text class="step" x="112" y="1295" >Summarize gene-centered signal</text>
  <text class="small" x="112" y="1319" >computeMatrix → plotHeatmap</text>
  <rect x="64" y="1331" width="504" height="90" rx="12" fill="#fff3e7"/>
  <text class="label" x="80" y="1350" style="fill:#b25d17; font-size:12px">DELIVERABLES</text>
  <text class="copy" x="80" y="1374">Filtered BAM / BAI · bigWig · QC plots</text>
  <text class="copy" x="80" y="1396">Matched-input tracks · gene-centered heatmap</text>
  <text class="small" x="80" y="1414" style="font-size:13px">Subtraction only for name-matched signal / input pairs.</text>
  </g>
  <g aria-label="ATAC-seq">
  <rect x="616" y="979" width="536" height="454" rx="18" fill="#fff" stroke="#d5ddea"/>
  <path d="M634 979h500" stroke="#b93759" stroke-width="4" stroke-linecap="round"/>
  <text class="heading" x="640" y="1021" >ATAC-seq</text>
  <rect x="1018" y="998" width="110" height="30" rx="8" fill="#fceef2"/>
  <text class="tag" x="1073.0" y="1019" fill="#b93759" text-anchor="middle">atacseq</text>
  <text class="copy" x="640" y="1049" >Paired-end · chromatin accessibility</text>
  <path d="M640 1069h488" stroke="#e3e8f0"/>
  <circle cx="654" cy="1097" r="14" fill="#fceef2"/>
  <text class="number" x="654" y="1097" fill="#b93759">1</text>
  <text class="step" x="680" y="1103" >Validate pairs; align each run</text>
  <text class="small" x="680" y="1127" >Before trimming: mate audit · Bowtie2 + RG QC</text>
  <path d="M654 1115v27" stroke="#b93759" stroke-opacity=".3" stroke-width="2"/>
  <circle cx="654" cy="1161" r="14" fill="#fceef2"/>
  <text class="number" x="654" y="1161" fill="#b93759">2</text>
  <text class="step" x="680" y="1167" >Merge runs by biological sample</text>
  <text class="small" x="680" y="1191" >Samtools merge → Picard once → filter + QC</text>
  <path d="M654 1179v27" stroke="#b93759" stroke-opacity=".3" stroke-width="2"/>
  <circle cx="654" cy="1225" r="14" fill="#fceef2"/>
  <text class="number" x="654" y="1225" fill="#b93759">3</text>
  <text class="step" x="680" y="1231" >Generate coverage; call peaks</text>
  <text class="small" x="680" y="1255" >Fragment CPM bigWig · MACS3 BAMPE / Genrich</text>
  <path d="M654 1243v27" stroke="#b93759" stroke-opacity=".3" stroke-width="2"/>
  <circle cx="654" cy="1289" r="14" fill="#fceef2"/>
  <text class="number" x="654" y="1289" fill="#b93759">4</text>
  <text class="step" x="680" y="1295" >Build consensus; count fragments</text>
  <text class="small" x="680" y="1319" >BEDTools · featureCounts · mito fraction / FRiP</text>
  <rect x="632" y="1331" width="504" height="90" rx="12" fill="#fceef2"/>
  <text class="label" x="648" y="1350" style="fill:#b93759; font-size:12px">DELIVERABLES</text>
  <text class="copy" x="648" y="1374">Run + sample BAMs · bigWig · narrowPeak</text>
  <text class="copy" x="648" y="1396">Consensus BED / SAF · count matrix · QC TSV</text>
  <text class="small" x="648" y="1414" style="font-size:13px">FRiP uses consensus peaks; coverage is not Tn5-shifted.</text>
  </g>
  <!-- Reporting rails collect outputs from every alternative, not just the bottom row. -->
  <path class="choice" d="M48 720H18v733h582M1152 720h30v733H600M324 1433v20M884 1433v20"/>
  <path class="flow" d="M600 1453v22"/>
  <rect x="48" y="1478" width="1104" height="84" rx="16" fill="#122238"/>
  <text x="72" y="1512" fill="#a9bfdc" font-size="14" font-weight="700" letter-spacing="1.4">04 / REPORT</text>
  <text x="72" y="1540" fill="#fff" font-size="21" font-weight="650">MultiQC + selected-workflow results</text>
  <text x="1128" y="1514" text-anchor="end" fill="#fff" font-size="18">multiqc_report.html</text>
  <text x="1128" y="1539" text-anchor="end" fill="#a9bfdc" font-size="15">Config-driven output directories</text>
  <text class="small" x="48" y="1592">Overview, not an exact DAG · QC reports are side outputs; arrows summarize analysis stages.</text>
</svg>
